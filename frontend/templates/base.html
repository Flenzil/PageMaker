<!doctype html>
<html lang="en" class="{% if request.cookies.get('dark_mode') == 'true' %}dark-mode{% endif %}">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <script> 
      (() => {
        const darkModeOn = localStorage.getItem("dark-mode") === "true";
        if (darkModeOn) {
          document.documentElement.classList.add("dark-mode");
        }
      })();
    </script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type = "text/css" href="{{ url_for('static', filename='css/style.css')}}">

    <title>{% block title %} {% endblock %}</title>
    <script src="http://localhost:5000/livereload.js"></script>
  </head>
  <body>
    <div class="dark-mode-container">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="dark-mode">
        <label class="form-check-label" for="dark-mode">Dark Mode</label>
      </div>
    </div>
    <div class="container">
        {% block upload %} {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/slider_display.js')}}"></script>
    <script type="module" src="{{ url_for('static', filename='js/disable-buttons.js')}}"></script>
    <script type="module" src="{{ url_for('static', filename='js/dark-mode.js')}}"></script>
  </body>
</html>
